[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobkit"
version = "0.8.0"
description = "Job-application engine: JD analysis, tailored resume + cover letter generation, interview prep."
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40",
    "pikepdf>=8.0",
    "pymupdf>=1.23",
    "python-docx>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
jobkit = "jobkit.cli:main"

[tool.hatch.version]
path = "src/jobkit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/jobkit"]
artifacts = ["src/jobkit/templates/**/*", "src/jobkit/reference/**/*"]
