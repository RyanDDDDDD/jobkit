<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Resume</title>
<style>
  /* jobkit render rewrites url("fonts/...") to absolute file:/// paths under
     templates/fonts/ (or a sibling fonts/ for workspace overrides). Keep the
     "fonts/" prefix, double quotes, no "./". */
  @font-face { font-family: "DM Sans"; src: url("fonts/DMSans.woff2") format("woff2");
    font-weight: 400 700; font-style: normal; font-display: swap; }
  @font-face { font-family: "Noto Sans SC"; src: url("fonts/NotoSansSC.woff2") format("woff2");
    font-weight: 400 700; font-style: normal; font-display: swap; }

  @page { size: A4; margin: 11mm 12mm 10mm; }

  /* Slate — one accent, no rules under headings, compact card-style entries
     (left accent spine instead of a border-bottom skyline) for density. */
  :root {
    --ink: #171a1f;
    --soft: #454d5c;
    --mute: #737b89;
    --hair: #d7dbe1;
    --accent: #0b6e6e;
    --label: var(--accent);
    --body: "DM Sans", "Noto Sans SC", "Segoe UI", "Helvetica Neue", sans-serif;
    --display: "DM Sans", "Noto Sans SC", "Segoe UI", "Helvetica Neue", sans-serif;
  }
  :lang(zh) {
    --body: "Noto Sans SC", "DM Sans", "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
    --display: "Noto Sans SC", "DM Sans", "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--body);
    font-size: 9.75pt;
    line-height: 1.32;
    color: var(--ink);
    font-feature-settings: "onum" 1, "kern" 1;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }

  body.compact { font-size: 9.1pt; line-height: 1.26; }
  body.compact section { margin-bottom: 7pt; }
  body.compact .entry { margin-bottom: 6pt; }
  body.compact ul.intro li { margin-bottom: 2.5pt; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 4pt 12pt;
    margin-bottom: 8pt;
    padding-bottom: 7pt;
    border-bottom: 1.25pt solid var(--accent);
  }
  .name {
    font-family: var(--display);
    font-weight: 700;
    font-size: 19pt;
    letter-spacing: 0;
    line-height: 1.05;
    margin: 0;
    color: var(--ink);
  }
  .contact { font-size: 8.4pt; color: var(--soft); letter-spacing: 0.01em; text-align: right; }
  .contact a { color: inherit; text-decoration: none; }
  .contact .sep { margin: 0 5px; color: var(--hair); }

  section { margin-bottom: 9pt; }
  h2 {
    font-family: var(--display);
    font-weight: 700;
    font-size: 9.5pt;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--ink);
    margin: 0 0 5pt;
    break-after: avoid;
  }
  h2::before {
    content: "";
    display: inline-block;
    width: 7pt;
    height: 7pt;
    margin-right: 5pt;
    background: var(--accent);
    vertical-align: -0.5pt;
  }

  ul { margin: 3pt 0 0; padding-left: 12pt; }
  li { margin-bottom: 2.25pt; }
  li::marker { color: var(--mute); }
  ul.intro { list-style: none; padding: 0; margin: 0; }
  ul.intro li { margin-bottom: 3pt; }
  ul.intro strong,
  .entry ul strong,
  .plainlist strong { font-weight: 700; color: var(--ink); }

  .entry {
    margin-bottom: 7pt;
    padding-left: 8pt;
    border-left: 2pt solid var(--hair);
    break-inside: avoid;
  }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12pt; }
  .primary { font-weight: 700; font-size: 10pt; color: var(--accent); }
  .meta-right { font-size: 8.4pt; color: var(--mute); font-feature-settings: "tnum" 1; white-space: nowrap; }
  .secondary { color: var(--soft); font-size: 9pt; }
  .stack { margin: 2.5pt 0 1pt; font-size: 8.5pt; color: var(--soft); }
  .stack .lbl,
  .summary .lbl,
  .skills .lbl {
    font-family: var(--display);
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    font-size: 8pt;
    color: var(--label);
    margin-right: 5px;
  }
  .summary {
    margin: 1pt 0 2pt;
    font-size: 8.8pt;
    color: var(--soft);
    line-height: 1.32;
    text-align: justify;
  }

  .edu-item { break-inside: avoid; margin-bottom: 4pt; padding-left: 8pt; border-left: 2pt solid var(--hair); }
  .edu-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12pt; margin-bottom: 2pt; }
  .edu-row .primary { font-weight: 700; font-size: 9.6pt; }
  .edu-note { font-weight: 400; font-size: 8pt; color: var(--mute); margin-left: 4px; }

  .skills p { margin: 2.25pt 0; }
  .plainlist { margin: 3.5pt 0 0; padding-left: 12pt; }
  .plainlist li { break-inside: avoid; }
  p, li { orphans: 2; widows: 2; }

  /* ---- Slate Chinese: same sans stack, slightly tighter ---- */
  body.domestic-zh {
    --ink: #171a1f;
    --soft: #454d5c;
    --mute: #737b89;
    --hair: #d7dbe1;
    --body: "Noto Sans SC", "DM Sans", "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
    --display: "Noto Sans SC", "DM Sans", "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
    font-family: var(--body);
    font-size: 8.9pt;
    line-height: 1.26;
    font-feature-settings: normal;
  }
  body.domestic-zh.compact { font-size: 8.75pt; line-height: 1.24; }
  body.domestic-zh.compact section { margin-bottom: 7px; }
  body.domestic-zh.compact .entry { margin-bottom: 6px; }
  body.domestic-zh.compact ul.intro li { margin-bottom: 2.5px; }

  body.domestic-zh header {
    display: flex;
    text-align: left;
    padding-bottom: 6px;
    margin-bottom: 7px;
  }
  body.domestic-zh .name {
    font-family: var(--display);
    font-weight: 700;
    font-size: 17pt;
    letter-spacing: 0.06em;
    line-height: 1.1;
    margin: 0;
  }
  body.domestic-zh .contact {
    text-align: right;
    font-size: 8.2pt;
    color: var(--soft);
    letter-spacing: 0;
    line-height: 1.3;
  }
  body.domestic-zh .contact .sep {
    display: inline;
    margin: 0 6px;
    color: var(--hair);
  }
  body.domestic-zh .contact .c-line { display: inline; }
  body.domestic-zh .contact a { color: inherit; text-decoration: none; }
  body.domestic-zh .contact a:hover { color: var(--accent); }

  body.domestic-zh section { margin-bottom: 8px; }
  body.domestic-zh h2 {
    font-family: var(--display);
    font-weight: 700;
    font-size: 9.25pt;
    letter-spacing: 0.08em;
    margin: 0 0 5px;
  }
  body.domestic-zh ul { margin: 2px 0 0; padding-left: 1.1em; }
  body.domestic-zh li { margin-bottom: 1.75px; text-align: justify; }
  body.domestic-zh ul.intro li { margin-bottom: 2.5px; text-align: justify; }
  body.domestic-zh ul.intro strong,
  body.domestic-zh .entry ul strong,
  body.domestic-zh .plainlist strong { font-weight: 700; color: var(--ink); }
  body.domestic-zh .entry { margin-bottom: 7px; padding-bottom: 1px; }
  body.domestic-zh .primary { font-weight: 700; font-size: 9.4pt; }
  body.domestic-zh .meta-right { font-size: 7.9pt; color: var(--mute); }
  body.domestic-zh .secondary { font-size: 8.3pt; color: var(--soft); }
  body.domestic-zh .stack { margin: 2.5px 0 1px; font-size: 7.9pt; color: var(--soft); }
  body.domestic-zh .stack .lbl,
  body.domestic-zh .summary .lbl,
  body.domestic-zh .skills .lbl {
    font-family: var(--display);
    font-weight: 700;
    letter-spacing: 0;
    font-size: 7.9pt;
    color: var(--label);
    margin-right: 5px;
    display: inline-block;
    min-width: 3.6em;
  }
  body.domestic-zh .summary {
    margin: 2px 0 3px;
    font-size: 8.15pt;
    color: var(--soft);
    line-height: 1.3;
    text-align: justify;
  }
  body.domestic-zh .edu-item { margin-bottom: 4px; }
  body.domestic-zh .edu-row .primary { font-size: 9.3pt; }
  body.domestic-zh .edu-note { font-size: 7.8pt; color: var(--mute); }
  body.domestic-zh .skills p { margin: 0 0 3px; text-align: justify; }
</style>
</head>
<body>
<main id="resume"></main>

<script type="application/json" id="resume-data">
{{DATA_JSON}}
</script>

<script>
(function () {
  "use strict";
  var data;
  try {
    data = JSON.parse(document.getElementById("resume-data").textContent);
    if (!data || typeof data !== "object") throw new Error("expected a JSON object");
  } catch (e) {
    document.getElementById("resume").textContent = "Invalid resume JSON: " + e.message;
    return;
  }

  var root = document.getElementById("resume");
  var isZh = data.lang === "zh";
  if (data.density === "compact") document.body.classList.add("compact");
  if (data.lang) document.documentElement.setAttribute("lang", data.lang);
  if (isZh) {
    document.body.classList.add("domestic-zh");
    var pageStyle = document.createElement("style");
    pageStyle.textContent = "@page { size: A4; margin: 10mm 11mm 10mm; }";
    document.head.appendChild(pageStyle);
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function frag(items, fn) { var f = document.createDocumentFragment(); (items || []).forEach(function (x) { f.appendChild(fn(x)); }); return f; }
  /* Turn **bold** spans into <strong>; everything else stays text (no other markdown). */
  function appendInlineMd(parent, text) {
    var s = text == null ? "" : String(text);
    var re = /\*\*([^*]+)\*\*/g;
    var last = 0, m;
    while ((m = re.exec(s))) {
      if (m.index > last) parent.appendChild(document.createTextNode(s.slice(last, m.index)));
      parent.appendChild(el("strong", null, m[1]));
      last = m.index + m[0].length;
    }
    if (last < s.length) parent.appendChild(document.createTextNode(s.slice(last)));
    if (!s) parent.appendChild(document.createTextNode(""));
  }

  /* ---------- header ---------- */
  var header = el("header");
  header.appendChild(el("div", "name", data.name || ""));
  var contact = el("div", "contact");
  (data.contact || []).forEach(function (c, i) {
    if (i) {
      var s = el("span", "sep");
      s.textContent = isZh ? "｜" : "·";
      contact.appendChild(s);
    }
    if (c && c.href) {
      var a = el("a"); a.href = c.href; a.textContent = c.text || c.href; contact.appendChild(a);
    } else {
      contact.appendChild(document.createTextNode(typeof c === "string" ? c : ((c && c.text) || "")));
    }
  });
  header.appendChild(contact);
  root.appendChild(header);

  /* ---------- introduction (optional) ---------- */
  if (data.intro && data.intro.length) {
    var s = el("section");
    s.appendChild(el("h2", null, data.introTitle || (isZh ? "简介" : "Introduction")));
    var ul = el("ul", "intro");
    ul.appendChild(frag(data.intro, function (b) {
      var li = el("li");
      if (b.lead) {
        var strong = el("strong", null, b.lead.replace(/[.:。．：]\s*$/, "") + (isZh ? "。" : "."));
        li.appendChild(strong);
        li.appendChild(document.createTextNode((isZh ? "" : " ") + (b.text || "")));
      }
      else { li.textContent = typeof b === "string" ? b : (b.text || ""); }
      return li;
    }));
    s.appendChild(ul);
    root.appendChild(s);
  }

  /* ---------- sections ---------- */
  var renderers = {
    entries: function (sec) {
      return frag(sec.items, function (it) {
        var e = el("div", "entry");
        var r1 = el("div", "row");
        r1.appendChild(el("span", "primary", it.primary || it.role || it.name || ""));
        if (it.dates || it.metaRight) r1.appendChild(el("span", "meta-right", it.dates || it.metaRight));
        e.appendChild(r1);
        if (it.secondary || it.org || it.location) {
          var r2 = el("div", "row");
          r2.appendChild(el("span", "secondary", it.secondary || it.org || ""));
          if (it.location) r2.appendChild(el("span", "meta-right", it.location));
          e.appendChild(r2);
        }
        if (it.stack) {
          var p = el("p", "stack");
          p.appendChild(el("span", "lbl", it.stackLabel || (isZh ? "技术栈：" : "Stack")));
          p.appendChild(document.createTextNode(it.stack || ""));
          e.appendChild(p);
        }
        var summaryText = it.summary || it.overview || it.description || "";
        if (summaryText) {
          var sum = el("p", "summary");
          sum.appendChild(el("span", "lbl", it.summaryLabel || (isZh ? "介绍：" : "Summary")));
          sum.appendChild(document.createTextNode(summaryText));
          e.appendChild(sum);
        }
        if (it.bullets && it.bullets.length) {
          var bul = el("ul");
          bul.appendChild(frag(it.bullets, function (b) {
            var li = el("li");
            appendInlineMd(li, typeof b === "string" ? b : (b && b.text) || "");
            return li;
          }));
          e.appendChild(bul);
        }
        return e;
      });
    },
    education: function (sec) {
      return frag(sec.items, function (it) {
        var f = el("div", "edu-item");
        var r1 = el("div", "edu-row");
        var inst = el("span", "primary");
        inst.appendChild(document.createTextNode(it.institution || ""));
        if (it.note || it.qs) {
          var note = el("span", "edu-note", "（" + (it.note || it.qs) + "）");
          inst.appendChild(note);
        }
        r1.appendChild(inst);
        if (it.dates) r1.appendChild(el("span", "meta-right", it.dates));
        f.appendChild(r1);
        if (it.credential || it.gpa || it.location) {
          var r2 = el("div", "edu-row");
          var credBits = [];
          if (it.credential) credBits.push(it.credential);
          if (it.gpa) credBits.push(it.gpa);
          r2.appendChild(el("span", "secondary", credBits.join(" · ")));
          if (it.location) r2.appendChild(el("span", "meta-right", it.location));
          f.appendChild(r2);
        }
        return f;
      });
    },
    skills: function (sec) {
      return frag(sec.groups, function (g) {
        var p = el("p");
        var label = g.label || "";
        if (isZh && label && label.slice(-1) !== "：" && label.slice(-1) !== ":") label = label + "：";
        p.appendChild(el("span", "lbl", label));
        p.appendChild(document.createTextNode(g.value || ""));
        return p;
      });
    },
    list: function (sec) {
      var list = el("ul", "plainlist");
      list.appendChild(frag(sec.items, function (x) {
        var li = el("li");
        appendInlineMd(li, typeof x === "string" ? x : (x && x.text) || "");
        return li;
      }));
      return list;
    }
  };

  (data.sections || []).forEach(function (sec) {
    var secEl = el("section");
    if (sec.type === "skills") secEl.classList.add("skills");
    secEl.appendChild(el("h2", null, sec.title));
    var fn = renderers[sec.type] || renderers.entries;
    secEl.appendChild(fn(sec));
    root.appendChild(secEl);
  });
})();
</script>
</body>
</html>
