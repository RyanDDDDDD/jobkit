# Your identity and canonical history. `apply` uses these values verbatim on
# every résumé and cover letter. Fill every line; `/job-application:setup` can
# populate the blanks from your old CVs, but never invents a phone or email.
name: ""            # TODO your full name, exactly as it should appear on the résumé
phone: ""           # TODO
email: ""           # TODO
# links: { github: "" }   # TODO uncomment and set your GitHub handle only (not a URL)
location: ""        # TODO City, Region, Country
working_rights: ""  # TODO e.g. full working rights in Australia
conventions:
  roles:
    - { company: "", title: "", start: "", end: "", location: "", ticker: "" }   # TODO one entry per role, most recent first; dates "Mon. YYYY" / "Present"; ticker optional, e.g. "NZX/ASX: FBU" -- leave "" unless publicly listed
  education:
    - { institution: "", credential: "", start: "", end: "", location: "", rank: "", gpa: "" }   # TODO one entry per credential; rank optional, e.g. "QS 2027 世界第19 / 澳大利亚第1"; gpa optional, only shown when include_gpa is true below
  density: compact          # resume spacing: compact | standard
  include_projects: false   # add a Selected Projects section when the JD makes projects relevant
  include_gpa: false        # show each education entry's gpa field on the résumé
